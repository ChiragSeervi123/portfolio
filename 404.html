<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Off the map · Chirag Seervi</title>
  <meta name="description" content="This page isn't on the survey. Head back to Chirag Seervi's portfolio.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0a0e13">

  <script>
    // Same theme logic as the other pages.
    (function () {
      var theme = null;
      try { theme = localStorage.getItem("theme"); } catch (e) {}
      if (theme !== "light" && theme !== "dark") {
        theme = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      }
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap">

  <!-- This page can be shown for a missing URL at any depth, where a relative
       link to css/main.css would break, so its few styles live right here. -->
  <style>
    :root {
      --bg: #0a0e13; --line: #1d2733; --line-2: #253140;
      --text: #f2ede4; --text-2: #a9b4c0; --accent: #e8a33d;
    }
    [data-theme="light"] {
      --bg: #f4efe6; --line: #ddd3c3; --line-2: #cbbfac;
      --text: #161b21; --text-2: #46505b; --accent: #b86e0f;
    }
    @media (prefers-color-scheme: light) {
      :root:not([data-theme]) {
        --bg: #f4efe6; --line: #ddd3c3; --line-2: #cbbfac;
        --text: #161b21; --text-2: #46505b; --accent: #b86e0f;
      }
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
      box-sizing: border-box;
      background-color: var(--bg);
      background-image:
        linear-gradient(var(--line) 1px, transparent 1px),
        linear-gradient(90deg, var(--line) 1px, transparent 1px);
      background-size: 40px 40px;
      color: var(--text);
      font-family: "Instrument Serif", Georgia, serif;
    }
    main { max-width: 560px; }
    .label {
      margin: 0 0 16px;
      font-family: "JetBrains Mono", ui-monospace, Consolas, monospace;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: var(--accent);
    }
    h1 {
      margin: 0;
      font-style: italic;
      font-weight: 400;
      font-size: clamp(56px, 14vw, 104px);
      line-height: 1;
    }
    .rule { display: block; width: 120px; height: 2px; margin: 24px 0 20px; background: var(--accent); }
    p.lead { margin: 0 0 32px; font-style: italic; font-size: 24px; line-height: 1.3; color: var(--text-2); }
    a {
      display: inline-block;
      padding: 12px 20px;
      border: 1px solid var(--accent);
      background: var(--accent);
      color: var(--bg);
      font-family: "JetBrains Mono", ui-monospace, Consolas, monospace;
      font-size: 12px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      text-decoration: none;
    }
    a:hover { background: transparent; color: var(--accent); }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <p class="label">Error 404 · No survey data</p>
    <h1>Off the map.</h1>
    <span class="rule" aria-hidden="true"></span>
    <p class="lead">This page isn't on the survey. The trail picks up again back home.</p>
    <a id="home-link" href="index.html">← Back to the log</a>
  </main>

  <script>
    // On GitHub Pages the site lives under /portfolio/; elsewhere (Vercel) it's at /.
    var home = location.pathname.indexOf("/portfolio/") === 0 ? "/portfolio/" : "/";
    if (location.protocol !== "file:") document.getElementById("home-link").href = home;
  </script>
</body>
</html>
